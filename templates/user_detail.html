{% extends "base.html" %}

{% block content %}
    <div class="container">
	    {% if not error %}
            <h2 align="center">Информация об авторе:</h2>
            <p><b>Юзернейм</b>: {{ user.name }}</p>
            {% if user.avatar %}
                <p><b>Аватар:</b></p><br>
                <img src="{{ url_for('static', path=user.avatar) }}" style="width: 300px; height: 300px"><br>
             {% endif %}
        {% else %}
             <h2 align="center">К сожалению, такого пользователя не существует! :(</h2>
        {% endif %}
    </div>
{% endblock %}
