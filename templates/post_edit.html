{%  extends "base.html" %}


{% block content %}
	<div class="container">
        <h2 class="m-3" align="center">Изменение поста</h2>
        <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="name" class="form-label">Название</label>
                <input type="text" class="form-control" id="name" name="title" value="{{ post.title }}">
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Содержание</label>
                <textarea class="form-control" rows="3" name="content">{{ post.content }}</textarea>
            </div>
            <div class="mb-3">
                <label for="formFile" class="form-label">Загрузить картинки</label>
                <input class="form-control" type="file" id="formFileMultiple" multiple name="images">
            </div>
            <div class="mb-3">
                <label for="tag" class="form-label">Изменить теги</label>
                <select class="form-select" aria-label="Default select example" name="tags" id ="tag" multiple>
                {% for tag in tags %}
                    <option value="{{ tag.title }}" name="tags">{{ tag.title }}</option>
                {% endfor %}
                </select>
            <button class="btn btn-success mb-2">Изменить</button>
        </form>
        <p class="text-danger">{{ error }}</p>
    </div>
{% endblock %}
