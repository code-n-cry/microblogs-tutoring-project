{% extends "base.html" %}


{% block content %}
<div class="container">
    {% for post in all_posts %}
        <div class="card m-3">
            <h5 class="card-title"><b>{{ post.title }}</b></h5>
            <p class="card-text">{{ post.content }}</p>
            <a href="/posts/{{ post.id }}" class="card-link">О посте</a>
            <a href="/users/{{ post.author.id }}" class="card-link">Об авторе</a>
        </div>
    {% endfor %}
</div>
    {% endblock %}
